[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vct-analytics-backend"
version = "1.0.0"
description = "VCT Analytics API and reconciliation dry run"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pymongo>=4.11,<5.0",
  "httpx>=0.28,<1.0",
  "duckdb>=1.2,<2.0",
  "beautifulsoup4>=4.13,<5.0",
  "python-dotenv>=1.0,<2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
